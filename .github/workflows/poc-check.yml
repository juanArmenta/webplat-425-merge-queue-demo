name: POC Merge Queue Check

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Read-only. No deployment or secret access.
permissions:
  contents: read

jobs:
  mq-poc-check:
    name: mq-poc-check
    runs-on: ubuntu-latest
    # Comfortably above runner startup (60s) + intentional delay (120s)
    timeout-minutes: 8
    # No concurrency cancellation: cancelling would kill another entry's required check.
    steps:
      - name: Checkout actual event commit
        uses: actions/checkout@v4
        with:
          # Explicit SHA so merge_group events check the tentative merge commit,
          # not the PR head or main tip.
          ref: ${{ github.sha }}

      - name: Log event context
        run: |
          echo "event:     ${{ github.event_name }}"
          echo "sha:       ${{ github.sha }}"
          echo "ref:       ${{ github.ref }}"
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Validate fixture files
        run: |
          set -euo pipefail
          missing=0
          for f in mq-poc/application.txt mq-poc/dependencies.json mq-poc/values.yaml; do
            if [ ! -f "$f" ]; then
              echo "FAIL: missing $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

          python3 -c "import json, sys; json.load(open('mq-poc/dependencies.json'))" \
            || { echo "FAIL: dependencies.json invalid JSON"; exit 1; }

          echo "Fixture validation passed"

      # Only in merge_group: simulate a long-running check so concurrent bot pushes
      # can be observed during validation. Logged timestamps prove ordering.
      - name: Queue check delay (merge_group only)
        if: github.event_name == 'merge_group'
        run: |
          echo "merge_group queue-check start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "tested sha: ${{ github.sha }}"
          sleep 120
          echo "merge_group queue-check end:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Fail if FAIL_QUEUE marker present (merge_group only)
        if: github.event_name == 'merge_group'
        run: |
          if [ -f mq-poc/FAIL_QUEUE ]; then
            echo "INTENTIONAL FAIL: mq-poc/FAIL_QUEUE marker found in merge commit"
            exit 1
          fi
          echo "No FAIL_QUEUE marker — queue check passed"
